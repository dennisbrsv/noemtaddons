import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.10"
	id 'com.gradleup.shadow' version '9.0.0-beta10'
}

configurations {
	shadowModImpl
	implementation.extendsFrom(shadowModImpl)
}

loom {
	accessWidenerPath = file("src/main/resources/noemtaddons.accesswidener")
	splitEnvironmentSourceSets()

	mods {
		"noemtaddons" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	mavenCentral()
	maven {
		name = "NotEnoughUpdates"
		url = "https://maven.notenoughupdates.org/releases/"
	}
	maven {
		name = "NeaReleases"
		url = "https://repo.nea.moe/releases"
	}
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// MoulConfig Dependency
	shadowModImpl("org.notenoughupdates.moulconfig:modern-26.1:4.7.2")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_25
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

def createBuildProps(String buildType) {
	def dir = file("${layout.buildDirectory.get().asFile}/generated/buildProps/${buildType}")
	dir.mkdirs()
	def propFile = file("${dir}/build-info.properties")
	propFile.text = "build_type=${buildType}\nversion=${project.version}\n"
	return dir
}

tasks.shadowJar {
	configurations = [project.configurations.shadowModImpl]
	from sourceSets.main.output
	from sourceSets.client.output
	from({ createBuildProps("cheat") })
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	exclude "moulconfig.accesswidener"
	relocate "io.github.notenoughupdates.moulconfig", "dev.noemt.client.deps.moulconfig"
	archiveClassifier.set("")
	mergeServiceFiles()

	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

def createLoaderProps() {
	def dir = file("${layout.buildDirectory.get().asFile}/generated/loaderProps")
	dir.mkdirs()
	def propFile = file("${dir}/loader-info.properties")
	propFile.text = "flavor=cheat\nversion=${project.version}\n"
	return dir
}

def loaderJar = tasks.register('loaderJar', Jar) {
	group = "build"
	description = "Builds the NoemtAddons mod-loader bootstrap jar."
	from(sourceSets.client.output) {
		include "dev/noemt/loader/**"
	}
	from(createLoaderProps())
	from("src/client/resources/fabric.mod.loader.json") {
		rename { "fabric.mod.json" }
	}
	from("src/client/resources/noemtaddons.client.mixins.json")
	archiveBaseName.set("noemtaddons-loader")
	archiveClassifier.set("")
	destinationDirectory.set(file("${layout.buildDirectory.get().asFile}/libs"))
}

tasks.register('buildLoader') {
	group = "build"
	description = "Builds the loader JAR."
	dependsOn loaderJar
}

tasks.jar {
	enabled = false
}

tasks.register('signPayload') {
	group = "build"
	description = "Cryptographically signs the shadow JAR payload using the offline Ed25519 private key."
	dependsOn tasks.shadowJar

	doLast {
		def privKeyFile = file("keys/ed25519_private.key")
		if (!privKeyFile.exists()) {
			logger.warn("⚠️ Private key 'keys/ed25519_private.key' not found. Run 'java scripts/Signer.java generate-keys' to create one.")
			return
		}

		def jarFile = tasks.shadowJar.archiveFile.get().asFile
		def sigFile = file("${jarFile.absolutePath}.sig")

		byte[] jarBytes = jarFile.bytes
		byte[] privBytes = privKeyFile.bytes

		def spec = new java.security.spec.PKCS8EncodedKeySpec(privBytes)
		def kf = java.security.KeyFactory.getInstance("Ed25519")
		def privateKey = kf.generatePrivate(spec)

		def sig = java.security.Signature.getInstance("Ed25519")
		sig.initSign(privateKey)
		sig.update(jarBytes)
		byte[] signatureBytes = sig.sign()

		sigFile.bytes = signatureBytes
		println "✍️ [signPayload] Cryptographically signed ${jarFile.name} -> ${sigFile.name} (${signatureBytes.length} bytes Ed25519)"

		// Copy release artifacts into server/jars/ for git tracking and instant remote pull
		def serverJarsDir = file("server/jars")
		serverJarsDir.mkdirs()
		copy {
			from jarFile
			into serverJarsDir
			rename { "noemtaddons.jar" }
		}
		copy {
			from sigFile
			into serverJarsDir
			rename { "noemtaddons.jar.sig" }
		}
		copy {
			from tasks.loaderJar.archiveFile.get().asFile
			into serverJarsDir
			rename { "noemtaddons-loader.jar" }
		}
		println "📦 [signPayload] Copied release artifacts to server/jars/ (Ready for git push)"
	}
}

tasks.assemble {
	dependsOn tasks.shadowJar
	dependsOn loaderJar
	finalizedBy tasks.signPayload
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}